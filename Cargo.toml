[workspace]
resolver = "2"
members = [
  "crates/delivery_types",
  "crates/delivery_integrity",
  "crates/delivery_coordinator",
  "crates/delivery_api",
  "playground/zomes/secret_integrity",
  "playground/zomes/secret",
  "playground/zomes/agent_directory",
  "playground/zomes/agent_directory_integrity",
  ##"sweettest",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.75.0"
edition = "2021"

[workspace.lints.rust]
non_upper_case_globals = "allow"
unused_doc_comments = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
unused_attributes = "allow"
ill_formed_attribute_input = "allow"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false }
holochain_serialized_bytes = "=0.0.57"
hdi = { version = "=0.8.0", default-features = false, features = ["trace"] }
hdk = { version = "=0.7.0", default-features = false }

# zdk 0.7 line, rev-pinned (never a branch: a branch makes the build
# non-reproducible and therefore the DNA hash non-reproducible).
zome_utils = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816" }
zome_signals = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816" }
zome_core = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816" }

[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release.package.delivery_sweettest]
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
lto = true # link time optimization

[profile.release.build-override]
opt-level = "z"
