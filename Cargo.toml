[workspace]
resolver = "2"
members = [
  "crates/delivery_types",
  "crates/delivery_integrity",
  "crates/delivery_coordinator",
  "crates/delivery_api",
  "playground/zomes/secret_integrity",
  "playground/zomes/secret",
  "playground/zomes/agent_directory",
  "playground/zomes/agent_directory_integrity",
  ##"sweettest",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.75.0"
edition = "2021"

[workspace.lints.rust]
non_upper_case_globals = "allow"
unused_doc_comments = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
unused_attributes = "allow"
ill_formed_attribute_input = "allow"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false }
holochain_serialized_bytes = "=0.0.57"
hdi = { version = "=0.8.0", default-features = false, features = ["trace"] }
hdk = { version = "=0.7.0", default-features = false }

# zdk 0.7 line. Local sibling checkouts until ddd-mtl/zdk main-0.7 is pushed;
# swap these three back to the git form below once the branch is published.
#zome_utils = { git = "https://github.com/ddd-mtl/zdk", branch = "main-0.7" }
#zome_signals = { git = "https://github.com/ddd-mtl/zdk", branch = "main-0.7" }
#zome_core = { git = "https://github.com/ddd-mtl/zdk", branch = "main-0.7" }
zome_utils = { path = "../zdk/crates/zome_utils" }
zome_signals = { path = "../zdk/crates/zome_signals" }
zome_core = { path = "../zdk/zomes/zome_core" }

[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release.package.delivery_sweettest]
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
lto = true # link time optimization

[profile.release.build-override]
opt-level = "z"
